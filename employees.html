<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة الموظفين</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>قائمة الموظفين</h1>

    <!-- فورم إضافة موظف -->
    <section class="form-section">
      <h2>إضافة موظف</h2>
      <form id="employee-form">
        <div class="form-group">
          <label for="emp-name">الاسم</label>
          <input type="text" id="emp-name" class="form-input" placeholder="أدخل اسم الموظف" required />
        </div>

        <div class="form-group">
          <label for="emp-role">المسمى الوظيفي</label>
          <input type="text" id="emp-role" class="form-input" placeholder="أدخل المسمى الوظيفي" required />
        </div>

        <div class="form-group">
          <label for="emp-dept">القسم</label>
          <select id="emp-dept" class="form-select" required>
            <option value="">اختر القسم</option>
            <option value="الموارد البشرية">الموارد البشرية</option>
            <option value="تطوير البرمجيات">تطوير البرمجيات</option>
            <option value="المبيعات">المبيعات</option>
          </select>
        </div>

        <div class="form-group">
          <label for="emp-status">الحالة</label>
          <select id="emp-status" class="form-select" required>
            <option value="active">نشط (أخضر)</option>
            <option value="pending">قيد المراجعة (أصفر)</option>
            <option value="inactive">غير نشط (أحمر)</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">إضافة</button>
          <button type="reset" class="btn btn-secondary">مسح</button>
        </div>
      </form>
    </section>

    <!-- الجدول الرئيسي للموظفين -->
    <section class="table-section">
      <h2>بيانات الموظفين</h2>
      <div class="table-responsive">
        <table class="employees-table">
          <thead>
            <tr>
              <th>الاسم</th>
              <th>المسمى الوظيفي</th>
              <th>القسم</th>
              <th>الحالة</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>أحمد محمود</td>
              <td>مطور واجهات أمامية</td>
              <td>تطوير البرمجيات</td>
              <td><span class="badge badge-success">نشط</span></td>
            </tr>
            <tr>
              <td>سارة علي</td>
              <td>أخصائية موارد بشرية</td>
              <td>الموارد البشرية</td>
              <td><span class="badge badge-warning">قيد المراجعة</span></td>
            </tr>
            <tr>
              <td>كريم حسن</td>
              <td>مسؤول مبيعات</td>
              <td>المبيعات</td>
              <td><span class="badge badge-danger">غير نشط</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</body>
</html>
